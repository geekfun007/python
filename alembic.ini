# Alembic 配置文件
# 用于数据库迁移

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板目录
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 时区
# timezone =

# 截断版本号
# truncate_slug_length = 40

# 版本号模式
# revision_environment = false

# 源代码编码
# sourceless = false

# 版本表名
# version_table = alembic_version

# 版本表 Schema
# version_table_schema =

# 版本位置路径分隔符
# version_path_separator = os  # 默认: 使用 os.pathsep

# 数据库 URL (从环境变量获取)
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# 代码格式化钩子
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
